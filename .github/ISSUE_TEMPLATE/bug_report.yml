name: Bug report
description: Report a bug in LlamaBox
labels:
  - bug
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug you encountered.
      placeholder: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
      placeholder: A clear and concise description of what you expected to happen.
    validations:
      required: false
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: If applicable, provide steps to consistently reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Tap on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: false
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Which version of LlamaBox are you running?
      placeholder: e.g., 1.0.6 (28)
    validations:
      required: false
  - type: input
    id: device-android
    attributes:
      label: Device / Android version
      description: What device and Android version are you using?
      placeholder: e.g., Samsung Galaxy S24 / Android 14
    validations:
      required: false
  - type: textarea
    id: logs-screenshots
    attributes:
      label: Logs / screenshots
      description: If applicable, add logs or screenshots to help explain the problem.
      placeholder: Paste logs or drag-and-drop screenshots.
    validations:
      required: false
